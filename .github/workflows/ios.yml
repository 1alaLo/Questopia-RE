name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ ios ]

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned IPA
    # Intel image on purpose: the arm64 macOS pool regularly runs out of
    # capacity and the job then fails to ever get a runner. The device build is
    # cross-compiled for iphoneos/arm64 either way, so the host arch is
    # irrelevant to the output.
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install native build tools
        run: brew install cmake ninja

      - name: Build QSP engine for device
        run: |
          chmod +x native/qsp/build_ios.sh
          native/qsp/build_ios.sh iphoneos arm64
          cp native/qsp/build/ios/iphoneos-arm64/libqsp_all.a ios/libqsp_all.a

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build unsigned app
        run: flutter build ios --release --no-codesign

      - name: Verify QSP symbols in the app binary
        run: nm -gU build/ios/iphoneos/Runner.app/Runner | grep QSPInit

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Questopia-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Questopia-unsigned-ipa
          path: Questopia-unsigned.ipa
          retention-days: 14
